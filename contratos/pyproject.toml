[project]
name = "contratos"
version = "1.0.0"
description = "Contrato do evento de pedido da loja (modelos Pydantic + JSON Schema v1)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contratos"]
