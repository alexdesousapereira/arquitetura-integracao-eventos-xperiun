[project]
name = "api-consulta"
version = "0.1.0"
description = "API de consulta de cargas a partir do tópico de eventos."
requires-python = ">=3.12"
dependencies = [
    "contratos",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "aiokafka>=0.12",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_consulta"]
