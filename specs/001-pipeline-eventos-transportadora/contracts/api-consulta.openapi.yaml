openapi: 3.1.0
info:
  title: API de Consulta de Cargas
  version: 1.0.0
  description: >
    Consome o tópico `transportadora.carga.eventos.v1` e expõe o status atual, o histórico de
    eventos e indicadores agregados das cargas. Dados mantidos em memória, limitados à mesma janela
    de retenção do tópico (15 min, pelo `occurred_at`) e reconstruídos a partir do tópico a cada
    inicialização.
servers:
  - url: http://localhost:8002
tags:
  - name: cargas
  - name: consumo
  - name: saude
paths:
  /api/v1/cargas:
    get:
      tags: [cargas]
      summary: Lista cargas com filtro por status
      operationId: listarCargas
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StatusCarga" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Página de cargas ordenada por ultima_atualizacao desc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaCargas" }
        "422": { $ref: "#/components/responses/ParametroInvalido" }
  /api/v1/cargas/{carga_id}:
    get:
      tags: [cargas]
      summary: Detalhe e status atual de uma carga
      operationId: obterCarga
      parameters:
        - $ref: "#/components/parameters/CargaId"
      responses:
        "200":
          description: Carga encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carga" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/ParametroInvalido" }
  /api/v1/cargas/{carga_id}/eventos:
    get:
      tags: [cargas]
      summary: Histórico de eventos da carga em ordem cronológica
      operationId: listarEventosCarga
      parameters:
        - $ref: "#/components/parameters/CargaId"
      responses:
        "200":
          description: Histórico sem duplicatas
          content:
            application/json:
              schema:
                type: object
                required: [carga_id, eventos]
                properties:
                  carga_id: { type: string }
                  eventos:
                    type: array
                    items: { $ref: "./evento-carga.schema.json" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/ParametroInvalido" }
  /api/v1/resumo:
    get:
      tags: [cargas]
      summary: Indicadores agregados
      operationId: obterResumo
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resumo" }
  /api/v1/consumo/status:
    get:
      tags: [consumo]
      summary: Status do consumo do tópico (lag por partição)
      operationId: obterStatusConsumo
      responses:
        "200":
          description: Status do consumidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusConsumo" }
  /health/live:
    get:
      tags: [saude]
      summary: Processo vivo
      operationId: live
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
  /health/ready:
    get:
      tags: [saude]
      summary: Pronto (broker acessível e catch-up inicial concluído)
      operationId: ready
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
        "503":
          description: Não pronto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
  /metrics:
    get:
      tags: [saude]
      summary: Métricas no formato Prometheus
      operationId: metrics
      responses:
        "200":
          description: Texto Prometheus
          content:
            text/plain: { schema: { type: string } }
components:
  parameters:
    CargaId:
      name: carga_id
      in: path
      required: true
      schema: { type: string, pattern: "^CRG-[0-9A-F]{8}$" }
  responses:
    NaoEncontrado:
      description: Carga não encontrada (inexistente ou com todos os eventos fora da janela de retenção de 15 min)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    ParametroInvalido:
      description: Parâmetro inválido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    StatusCarga:
      type: string
      enum: [RECEBIDA, EM_TRANSPORTE, EM_TRANSITO, SAIU_PARA_ENTREGA, ENTREGUE, FALHA_ENTREGA]
    Localidade:
      type: object
      required: [cidade, uf]
      properties:
        cidade: { type: string }
        uf: { type: string }
    Carga:
      type: object
      required: [carga_id, status, ultima_atualizacao, total_eventos, tentativas_entrega, correlation_id]
      properties:
        carga_id: { type: string }
        status: { $ref: "#/components/schemas/StatusCarga" }
        origem: { oneOf: [{ $ref: "#/components/schemas/Localidade" }, { type: "null" }] }
        destino: { oneOf: [{ $ref: "#/components/schemas/Localidade" }, { type: "null" }] }
        peso_kg: { type: [number, "null"] }
        descricao: { type: [string, "null"] }
        tentativas_entrega: { type: integer, minimum: 0 }
        ultima_atualizacao: { type: string, format: date-time }
        total_eventos: { type: integer, minimum: 1 }
        correlation_id: { type: string }
    PaginaCargas:
      type: object
      required: [itens, page, size, total]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Carga" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    Resumo:
      type: object
      required: [total_cargas, total_eventos, cargas_por_status, eventos_duplicados_descartados, eventos_enviados_dlq, atualizado_em]
      properties:
        total_cargas: { type: integer }
        total_eventos: { type: integer }
        cargas_por_status:
          type: object
          description: Todas as chaves de StatusCarga presentes (0 quando vazio)
          additionalProperties: { type: integer }
        eventos_duplicados_descartados: { type: integer }
        eventos_enviados_dlq: { type: integer }
        atualizado_em: { type: string, format: date-time }
    StatusConsumo:
      type: object
      required: [topico, catch_up_concluido, particoes, lag_total]
      properties:
        topico: { type: string }
        catch_up_concluido: { type: boolean }
        lag_total: { type: integer, minimum: 0 }
        particoes:
          type: array
          items:
            type: object
            required: [particao, posicao, offset_final, lag]
            properties:
              particao: { type: integer }
              posicao: { type: integer }
              offset_final: { type: integer }
              lag: { type: integer, minimum: 0 }
    Saude:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degradado, indisponivel] }
        dependencias:
          type: object
          additionalProperties: { type: string }
    Problema:
      description: RFC 9457 Problem Details
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlation_id: { type: string }
