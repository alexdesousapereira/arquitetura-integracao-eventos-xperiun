[project]
name = "notificador"
version = "0.1.0"
description = "Bot que consome o tópico de eventos e envia uma mensagem por evento ao Telegram."
requires-python = ">=3.12"
dependencies = [
    "contratos",
    "aiokafka>=0.12",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notificador"]
