[project]
name = "controle-ingestao"
version = "0.1.0"
description = "API de controle do conector Kafka Connect de ingestão de arquivos."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controle_ingestao"]
