[project]
name = "simulador"
version = "0.1.0"
description = "Simulador de eventos do ciclo de vida de pedidos de uma loja."
requires-python = ">=3.12"
dependencies = [
    "contratos",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
contratos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulador"]
